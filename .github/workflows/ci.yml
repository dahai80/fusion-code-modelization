name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.12", "3.13"]
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Install fusion-core (in-tree dependency, not on PyPI)
              run: pip install git+https://github.com/dahai80/fusion-core.git
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[test]"
            - name: Verify production install path (.[server])
              run: pip install -e ".[server]"
            - name: Run tests with coverage
              run: pytest tests/ -v --tb=short --cov=fusion_code_modelization --cov-fail-under=82

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install fusion-core (in-tree dependency, not on PyPI)
              run: pip install git+https://github.com/dahai80/fusion-core.git
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[lint]"
            - name: Ruff check
              run: ruff check .
            - name: Ruff format check
              run: ruff format --check .

    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install fusion-core (in-tree dependency, not on PyPI)
              run: pip install git+https://github.com/dahai80/fusion-core.git
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[test]"
                  pip install mypy
            - name: Run mypy
              run: mypy fusion_code_modelization/ --ignore-missing-imports --no-error-summary

    security:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install fusion-core (in-tree dependency, not on PyPI)
              run: pip install git+https://github.com/dahai80/fusion-core.git
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install bandit
                  pip install -e .
            - name: Run bandit
              run: bandit -r fusion_code_modelization/ -ll -ii

name: docs

on:
  pull_request:
    paths:
      - "**.md"
      - "ci/validate_docs.py"
      - ".github/workflows/docs.yml"

# fusion#2 CI retrofit: cancel superseded docs-validation runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate docs contract
        run: |
          python3 ci/validate_docs.py --root . --product fusion-code-modelization \
            --class app --entry service \
            --skip-dirs ".git,node_modules,.venv,dist,build,templates,guidelines,logs,.ruff_cache,.pytest_cache,.agent_comm_state,.fusion,fusion_code_modelization.egg-info"

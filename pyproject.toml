[project]
name = "fusion-code-modenization"
version = "0.3.0"
description = "Fusion-Code-Modenization — Legacy code modernization and cross-language migration powered by fusion-mlx"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
]
lint = [
    "ruff>=0.8.0",
]

[project.scripts]
fusion-code-modelization = "fusion_code_modelization.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["fusion_code_modelization"]

[tool.setuptools.packages.find]
include = ["fusion_code_modelization*"]

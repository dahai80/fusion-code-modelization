[project]
name = "fusion-code-modelization"
version = "0.6.3"
description = "Fusion-Code-Modernization — Local-first legacy code modernization and cross-language migration toolkit powered by fusion-mlx"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
]
server = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]
lint = [
    "ruff>=0.8.0",
]
dev = [
    "mypy>=1.10.0",
    "bandit>=1.7.0",
]

[project.scripts]
fusion-code-modelization = "fusion_code_modelization.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["fusion_code_modelization"]

[tool.setuptools.packages.find]
include = ["fusion_code_modelization*"]
